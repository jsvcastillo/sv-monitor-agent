server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}

scrape_configs:

  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: ${HOSTNAME}
          __path__: /var/log/*.log

  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          host: ${HOSTNAME}
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

  - job_name: suricata
    static_configs:
      - targets:
          - localhost
        labels:
          job: suricata_logs
          host: ${HOSTNAME}
          __path__: /tmp/suricata/eve.json