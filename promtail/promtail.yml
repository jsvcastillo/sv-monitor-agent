server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: ${LOKI_URL}
scrape_configs:

  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          agent_host: ${HOSTNAME}
          __path__: /var/log/*.log
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          agent_host: ${HOSTNAME}
          __path__: /var/lib/docker/containers/*/*-json.log
  - job_name: suricata
    pipeline_stages:
         - json:
             expressions:
               event_type: event_type
               src_ip: src_ip
               proto: proto
               dest_port: dest_port
               alert:
         - json:
             expressions:
               action: action
               signature_id: signature_id
               signature: signature
               category: category
               severity: severity
             source: alert
         - labels:
             event_type:
             src_ip:
             proto:
             dest_port:
             signature_id:
             signature:
             category:
             severity:
    static_configs:
      - targets:
        - localhost
        labels:
          job: suricata_logs
          agent_host: ${HOSTNAME}
          __path__: /tmp/suricata/eve.json